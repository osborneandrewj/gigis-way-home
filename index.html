<title>GiGi's Way Home</title>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #0c0a20;
    color: #fff;
    overflow: hidden;
    position: fixed;
    inset: 0;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      env(safe-area-inset-top)
      env(safe-area-inset-right)
      env(safe-area-inset-bottom)
      env(safe-area-inset-left);
  }
  #stage { position: relative; flex: 0 0 auto; touch-action: none; }
  #c, #ov {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    image-rendering: -moz-crisp-edges;
    image-rendering: pixelated;
  }
  #c { z-index: 1; touch-action: none; }
  #ov { z-index: 3; pointer-events: none; }
  #tx {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
    image-rendering: auto;
  }
  #gigi {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    image-rendering: auto;
    transform-origin: 50% 100%;
    -webkit-user-drag: none;
    user-select: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #gigi { transform: none !important; }
  }
  #live {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }
  #turn {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 8;
    background: #0c0a20;
    color: #ffff55;
    font-family: ui-monospace, "Courier New", monospace;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    font-size: 28px;
    line-height: 1.4;
  }
  @media (orientation: portrait) {
    #turn { display: flex; }
    #stage { visibility: hidden; }
  }

function fontPx(font) {
  const m = /(\d+(?:\.\d+)?)px/.exec(font || '');
  return m ? parseFloat(m[1]) : 8;
}

function scaleFont(font) {
  const pix = pixelSnap || 1;
  let sized = String(font || '8px monospace').replace(/(\d+(?:\.\d+)?)px/g, function (_, n) {
    return (parseFloat(n) * pix).toFixed(2) + 'px';
  });
  if (sized.indexOf('monospace') >= 0) sized = sized.replace('monospace', '"GiGi Type", monospace');
  else sized += ', "GiGi Type", monospace';
  return sized;
}

function logicalMetrics(font, text) {
  const pix = pixelSnap || 1;
  tctx.font = scaleFont(font);
  const m = tctx.measureText(text);
  const ascent = m.actualBoundingBoxAscent || fontPx(font) * pix * 0.8;
  const descent = m.actualBoundingBoxDescent || fontPx(font) * pix * 0.22;
  return {
    width: m.width / pix,
    actualBoundingBoxAscent: ascent / pix,
    actualBoundingBoxDescent: descent / pix
  };
}

function clearTextLayer() {
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.clearRect(0, 0, tx.width, tx.height);
}

function installReadableText(ctx) {
  if (ctx.__readable) return;
  ctx.__readable = true;
  ctx.measureText = function (text) {
    return logicalMetrics(ctx.font || '8px monospace', text == null ? '' : String(text));
  };
  ctx.fillText = function (text, x, y) {
    const str = text == null ? '' : String(text);
    if (!str) return;
    const pix = pixelSnap || 1;
    tctx.font = scaleFont(ctx.font || '8px monospace');
    tctx.fillStyle = typeof ctx.fillStyle === 'string' ? ctx.fillStyle : '#fff';
    tctx.textBaseline = 'alphabetic';
    tctx.textAlign = 'left';
    tctx.imageSmoothingEnabled = true;
    if ('imageSmoothingQuality' in tctx) tctx.imageSmoothingQuality = 'high';
    tctx.fillText(str, Math.round(x * pix), Math.round(y * pix));
  };
}

};

function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = b[i]; b[i] = b[j]; b[j] = t;

}

function defaultSave() {
  return {
    v: 1,
    unlocked: 1,
    cleared: [false, false, false, false, false, false, false, false],
    stars: [0, 0, 0, 0, 0, 0, 0, 0],
    settings: { mult: 1, mute: false },
    wonOn: null,
    resume: null
  };
}

function loadSave() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultSave();
    const d = JSON.parse(raw);
    if (!d || d.v !== 1) return defaultSave();
    const base = defaultSave();
    d.cleared = (d.cleared || []).concat(base.cleared).slice(0, 8);
    d.stars = (d.stars || []).concat(base.stars).slice(0, 8).map((n) => n | 0);
    d.settings = Object.assign(base.settings, d.settings || {});
    const mult = Number(d.settings.mult);
    if (![0.5, 1, 1.5, 2].includes(mult)) d.settings.mult = 1;
    d.settings.mute = !!d.settings.mute;
    d.unlocked = Math.max(1, Math.min(8, d.unlocked | 0 || 1));
    d.wonOn = typeof d.wonOn === 'string' ? d.wonOn : null;
    return Object.assign(base, d);
  } catch (e) {
    return defaultSave();
  }
}

function snapshotProblem(p) {
  if (!p) return null;
  return {

    misses: p.misses || 0,
    lines: p.lines ? p.lines.slice() : null,
    speech: p.speech || '',
    choices: p.choices ? p.choices.slice() : null
  };
}

function persist() {
  if (screen === 'title' || screen === 'parent' || screen === 'confirm') {
    S.resume = S.resume || null;
  } else {
    const named = (screen === 'clear' || screen === 'cert' || screen === 'finale' || screen === 'boss' || screen === 'hint');
    S.resume = {
      level: level,
      history: history.slice(),
      problemsDone: problemsDone,
      speedCorrect: speedCorrect,
      bonusSolved: bonusSolved,
      pass: pass,
      timeRelief: timeRelief,
      parentPick: parentPick,
      entry: entry,
      missReason: missReason,
      problem: snapshotProblem(problem),
      screen: named ? screen : 'play'
    };
  }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* private mode */ }
}

function fmtDate(iso) {
  const parts = String(iso).split('-');
  if (parts.length < 3) return iso;
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return (parts[2] | 0) + ' ' + months[(parts[1] | 0) - 1] + ' ' + parts[0];
}

function resumeAudio() {
  if (!actx || actx.state === 'running') return;
  try {
    const pending = actx.resume();
    if (pending && pending.catch) pending.catch(() => {});
  } catch (e) { /* audio optional */ }
}

function unlockAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    if (!actx) actx = new AC();
    resumeAudio();
    const buf = actx.createBuffer(1, 1, 22050);
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(actx.destination);
    src.start(0);
  } catch (e) { /* audio optional */ }
}

function tone(freq, dur, type, vol, when) {
  if (!actx || (S && S.settings.mute)) return;
  try {
    const t = when == null ? actx.currentTime : when;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(Math.max(0.0001, vol), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  } catch (e) { /* ignore */ }
}

function bg() {
  for (let y = 0; y < 200; y++) R(0, y, 320, 1, 'rgb(' + ((14 + y / 12) | 0) + ',' + ((12 + y / 14) | 0) + ',' + ((40 + y / 6) | 0) + ')');
  let s = 3;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = 0; i < 60; i++) R(rnd() * 320, 14 + rnd() * 90, 1, 1, rnd() > 0.5 ? '#8888cc' : '#5555aa');
  R(0, 168, 320, 32, '#2a1f4a');
  for (let x = 0; x < 320; x += 16) R(x, 168, 1, 32, '#352a5c');

  if (right) {

function bubble(x, y, w, lines) {
  const lineH = 12;
  const h = 8 + lines.length * lineH;
  R(x, y, w, h, '#fff');
  R(x - 2, y + 2, w + 4, h - 4, '#fff');
  R(x - 4, y + h - 10, 4, 4, '#fff');
  c.font = '8px monospace';
  c.fillStyle = '#1a1030';
  lines.forEach((l, i) => c.fillText(l, x + 5, y + 11 + i * lineH));
  return h;
}

}

function tile(x, y, w, h, text, font, opt) {
  opt = opt || {};
  const down = !!opt.down;
  const dim = !!opt.dim;
  const dy = down ? 1 : 0;
  if (opt.pulse && promptsTap() && !dim) drawPulse(x, y, w, h);
  const edge = dim ? '#221c3a' : (opt.on ? '#ffff55' : '#000055');
  const fill = dim ? '#1a1430' : (opt.good ? '#0d7a32' : (down ? '#222288' : '#3333bb'));
  R(x, y + dy, w, h, edge);
  R(x + 1, y + 1 + dy, w - 2, h - 2, fill);
  if (!down && !dim) R(x + 1, y + 1, w - 2, 2, opt.good ? '#b8e89a' : '#6666ff');
  c.font = (font || 'bold 16px') + ' monospace';
  c.fillStyle = dim ? '#665588' : '#fff';
  const m = c.measureText(text);
  // Digits share one figure box. Centering each glyph's own ink lifts a short
  // "7" above "6" and "10".
  const box = /^[0-9]+$/.test(text) ? c.measureText('8') : m;
  const ascent = box.actualBoundingBoxAscent || 10;
  const descent = box.actualBoundingBoxDescent || 2;
  const baseline = y + dy + (h + ascent - descent) / 2;
  c.fillText(text, x + (w - m.width) / 2, baseline);
  if (opt.id && !dim) buttons.push({ x: x, y: y, w: w, h: h, id: opt.id, label: text });
}

function baseProblem(a, b, kind) {
  return {
    a: a,
    b: b,
    kind: kind,
    answer: a - b,
    key: kind + ':' + a + '-' + b,
    recorded: false,
    wasTimed: false
  };
}

function l1Copy(a, b) {
  if (a === 7 && b === 3) {
    return {
      lines: ['I had 7 dots. I dropped 3', 'on the way home!', 'How many are left?'],
      speech: 'I had 7 dots. I dropped 3 on the way home. How many are left?'
    };
  }
  const bank = [
    {
      lines: ['I had ' + a + ' dots.', 'I dropped ' + b + '.', 'How many are left?'],
      speech: 'I had ' + a + ' dots. I dropped ' + b + '. How many are left?'
    },
    {
      lines: [a + ' buttons on GiGi.', b + ' popped off.', 'How many are left?'],
      speech: 'GiGi had ' + a + ' buttons. ' + b + ' popped off. How many are left?'
    },
    {
      lines: [a + ' stars were shining.', b + ' hid in a cloud.', 'How many are left?'],
      speech: a + ' stars were shining. ' + b + ' hid in a cloud. How many are left?'
    }
  ];
  return bank[problemsDone % bank.length];
}

function distractors(ans) {
  const pool = [];
  for (let d = 1; d <= 5; d++) {
    if (ans - d >= 0) pool.push(ans - d);
    if (ans + d <= 10) pool.push(ans + d);
  }
  const out = [ans];
  shuffle(pool).forEach((n) => {
    if (out.length < 3 && out.indexOf(n) < 0) out.push(n);
  });
  let n = 0;
  while (out.length < 3) {
    if (out.indexOf(n) < 0) out.push(n);
    n++;
  }
  return shuffle(out);
}

function decorate(p) {
  if (p.kind === 'take') {
    const copy = l1Copy(p.a, p.b);
    p.lines = copy.lines;
    p.speech = copy.speech;
    p.choices = (p.a === 7 && p.b === 3) ? [3, 4, 5] : distractors(p.answer);
  } else if (p.kind === 'bond') {
    p.speech = p.a + ' is made of ' + p.b + ' and what?';
    p.lines = [p.a + ' is ' + p.b + ' and what?', 'Find the missing part.'];
  } else if (p.kind === 'from10') {
    p.speech = 'What is 10 minus ' + p.b + '? Subtract from 10.';
    p.lines = ['Subtract from 10.', '10 take away ' + p.b + '.'];
  } else if (p.kind === 'bridge') {
    p.speech = 'What is ' + p.a + ' minus ' + p.b + '? You can bridge through 10.';
    p.lines = [p.a + ' minus ' + p.b + '.', 'Bridge through 10.'];
  } else if (p.kind === 'regroup') {
    p.speech = 'What is ' + p.a + ' minus ' + p.b + '? You may need to trade a ten.';
    p.lines = [p.a + ' minus ' + p.b + '.', 'Trade a ten if you need to.'];
  } else {
    p.speech = 'What is ' + p.a + ' minus ' + p.b + '?';
    p.lines = [p.a + ' minus ' + p.b + '.'];
  }
  if (level === 6) {
    const taunts = ['The sock grumbles. ', 'The sock squints. ', 'A stripe wiggles. ', 'The sock huffs. '];
    p.speech = pick(taunts) + p.speech;
  }
  return p;
}

function unit(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

function accept(p) {
  if (!p || p.b < 0 || p.a < p.b || p.answer !== p.a - p.b) return false;
  if (p.key === lastKey) return false;
  lastKey = p.key;
  return true;
}

function genTake() {
  const a = randint(2, 10);
  let b = randint(1, a);
  if (a - b === 0 && Math.random() < 0.7) b = randint(1, Math.max(1, a - 1));
  return baseProblem(a, b, 'take');
}
function genBond() {
  const whole = Math.random() < 0.55 ? 10 : randint(5, 9);
  const part = randint(1, whole - 1);
  return baseProblem(whole, part, 'bond');
}
function genWithin20() {
  const roll = Math.random();
  if (roll < 0.6) {
    const a = randint(11, 19);
    const ones = a % 10;
    if (ones < 1) return null;
    return baseProblem(a, randint(1, ones), 'noregroup');
  }
  if (roll < 0.8) {
    return baseProblem(randint(11, 20), 10, 'noregroup');
  }
  const a = randint(12, 19);
  const ones = a % 10;
  const b = 10 + randint(0, ones);
  if (b >= a) return null;
  return baseProblem(a, b, 'noregroup');
}
function genThrough10() {
  if (Math.random() < 0.35) return baseProblem(10, randint(1, 9), 'from10');
  const a = randint(11, 18);
  const ones = a % 10;
  if (ones >= 9) return null;
  return baseProblem(a, randint(ones + 1, 9), 'bridge');
}
function genPlace() {
  const a = randint(20, 40);
  const ta = (a / 10) | 0;
  const oa = a % 10;
  const roll = Math.random();
  if (roll < 0.28) {
    const tb = randint(1, Math.max(1, ((a - 1) / 10) | 0));
    const b = tb * 10;
    if (b >= a) return null;
    return baseProblem(a, b, 'place');
  }
  if (roll < 0.55) {
    if (oa < 1) return null;
    return baseProblem(a, randint(1, oa), 'place');
  }
  if (ta < 2) return null;
  const tb = randint(1, ta - 1);
  const bo = randint(0, oa);
  const b = tb * 10 + bo;
  if (b < 1 || b >= a) return null;
  return baseProblem(a, b, 'place');
}
function genRegroup() {
  const a = randint(20, 40);
  const oa = a % 10;
  const ta = (a / 10) | 0;
  // A ones digit of 9 can never be smaller than another digit, so it never regroups.
  if (ta < 2 || oa > 8) return null;
  if (Math.random() < 0.42) {
    const b = randint(oa + 1, 9);
    if (b > 9) return null;
    return baseProblem(a, b, 'regroup');
  }
  const bo = randint(oa + 1, 9);
  if (bo > 9) return null;
  const tb = randint(1, ta - 1);
  const b = tb * 10 + bo;
  if (b >= a || (b % 10) <= oa) return null;
  return baseProblem(a, b, 'regroup');
}

const GENS = [genTake, genBond, genWithin20, genThrough10, genPlace, genRegroup];
const FALLBACKS = [
  baseProblem(7, 3, 'take'),
  baseProblem(10, 4, 'bond'),
  baseProblem(17, 4, 'noregroup'),
  baseProblem(13, 5, 'bridge'),
  baseProblem(34, 12, 'place'),
  baseProblem(32, 15, 'regroup')
];

function rollGen(fn, fallback) {
  for (let i = 0; i < 50; i++) {
    const p = fn();
    if (accept(p)) return p;
  }
  lastKey = fallback.key;
  return baseProblem(fallback.a, fallback.b, fallback.kind);
}

function makeProblem(levelIndex) {
  if (levelIndex === 0 && problemsDone === 0 && history.length === 0 && S && !S.cleared[0]) {
    lastKey = 'take:7-3';
    return decorate(baseProblem(7, 3, 'take'));
  }
  let p;
  if (levelIndex === 6) p = rollGen(GENS[randint(0, 5)], FALLBACKS[randint(0, 5)]);
  else if (levelIndex === 7) p = rollGen(GENS[randint(0, 3)], FALLBACKS[0]);
  else p = rollGen(GENS[levelIndex], FALLBACKS[levelIndex]);
  return decorate(p);
}

function hintFor(p, strong) {
  const ansLine = p.a + ' - ' + p.b + ' = ' + p.answer;
  if (p.kind === 'take') {
    const lines = ['Count the dots with no X.', 'Those dots are left.'];
    if (strong) lines.push(ansLine);
    return { lines: lines, speech: strong ? ansLine + '. Count the dots that are left.' : 'Count the dots with no X. Those are left.' };
  }
  if (p.kind === 'bond') {
    const lines = ['Number bond.', p.a + ' is ' + p.b + ' and what?', 'The parts make the whole.'];
    if (strong) lines.push(p.a + ' = ' + p.b + ' + ' + p.answer);
    return { lines: lines.slice(0, strong ? 4 : 3), speech: strong ? p.a + ' is ' + p.b + ' and ' + p.answer + '.' : 'Look at the number bond. ' + p.a + ' is ' + p.b + ' and what?' };
  }
  if (p.kind === 'from10') {
    const lines = ['Subtract from 10.', p.b + ' and what make 10?', 'Count the open boxes.'];
    if (strong) lines.push(ansLine);
    return { lines: lines.slice(0, 4), speech: strong ? ansLine : 'Subtract from 10. Count the boxes that are left.' };
  }
  if (p.kind === 'bridge') {
    const ones = p.a % 10;
    const step2 = p.b - ones;
    const lines = ['Bridge through 10.', 'Take ' + ones + ' to land on 10.', 'Then take ' + step2 + ' more.'];
    if (strong) lines.push(ansLine);
    return { lines: lines.slice(0, 4), speech: strong ? ansLine : 'Bridge through 10. Take ' + ones + ' to make 10, then take ' + step2 + ' more.' };
  }
  if (p.kind === 'regroup') {
    const ta = (p.a / 10) | 0;
    const oa = p.a % 10;
    const lines = ['Trade 1 ten for 10 ones.', 'Now ' + unit(ta - 1, 'ten') + ' and ' + (oa + 10) + ' ones.', 'Then take away ' + p.b + '.'];
    if (strong) lines.push(ansLine);
    return { lines: lines.slice(0, 4), speech: strong ? ansLine : 'Trade 1 ten for 10 ones. Now take away ' + p.b + '.' };
  }
  const ta = (p.a / 10) | 0;
  const oa = p.a % 10;
  const tb = (p.b / 10) | 0;
  const ob = p.b % 10;
  let lines;
  if (tb === 0) lines = ['No trading needed.', 'Ones: ' + oa + ' take ' + ob + '.', 'The tens stay put.'];
  else if (ob === 0) lines = ['Subtract the tens.', unit(ta, 'ten') + ' take ' + unit(tb, 'ten') + '.', 'The ones stay put.'];
  else lines = ['Tens and ones.', unit(ta, 'ten') + ' take ' + tb + '.', oa + ' ones take ' + ob + '.'];
  if (strong) lines.push(ansLine);
  return { lines: lines.slice(0, 4), speech: strong ? ansLine : lines.join(' ') };
}

function levelBarName() {
  if (level === 6) return 'BOSS';
  if (level === 7) return 'BONUS';
  return 'LEVEL ' + (level + 1);
}

function statusRight() {
  if (level === 7) return 'PARADE \u2605 ' + bonusSolved + '/6';
  const correct = history.filter(Boolean).length;
  return '1ST TRY \u2605 ' + correct + '/10';
}

function statusLeft() {
  let name = "GIGI'S WAY HOME  -  " + levelBarName();
  if (screen === 'clear') name += ' CLEAR!';
  else if (screen === 'play' || screen === 'hint') {
    if (limitMs > 0 && phase === 'play' && screen === 'play') name += '  (TIMED)';
    else if (level > 0 && level < 7 && pass !== 'timed') name += '  WARM-UP';
  }
  return name;
}

function needsTimedPass() {
  return level >= 1 && level <= 6;
}

function limitSeconds() {
  if (level === 0 || level === 7 || pass !== 'timed') return 0;
  const base = Math.max(8, 20 - speedCorrect * 1.5);
  return base * (S.settings.mult || 1) + timeRelief;
}

function computeLimit() {
  return limitSeconds() * 1000;
}

function maxPlayable() {
  return Math.max(0, Math.min(7, (S.unlocked | 0) - 1));
}

function clampLevel(i, picked) {
  i = i | 0;
  if (picked && i >= 0 && i <= 7) return i;
  if (i < 0) return 0;
  const max = maxPlayable();
  return i > max ? max : i;
}

function levelOpen(i) {
  return (i | 0) < (S.unlocked | 0);
}

function remainMs(now) {
  if (limitMs <= 0) return 0;
  if (frozenRemain != null) return frozenRemain;
  return Math.max(0, limitMs - (now - startTime));
}

function filledDots(now) {
  if (limitMs <= 0) return 10;
  const ratio = remainMs(now) / limitMs;
  return Math.max(0, Math.ceil(ratio * 10 - 0.0001));
}

function startProblem(fresh) {
  if (fresh) {
    history = [];
    problemsDone = 0;
    speedCorrect = 0;
    timeRelief = 0;
    pass = 'untimed';
    if (level === 7) bonusSolved = 0;
  }
  problem = makeProblem(level);
  problem.wasTimed = false;
  entry = '';
  missReason = '';
  phase = 'play';
  screen = 'play';
  lastTickSec = -1;
  limitMs = computeLimit();
  problem.wasTimed = limitMs > 0;
  startTime = performance.now();
  frozenRemain = null;
  frozenByAway = false;
  setLive(problem.speech);
  persist();
}

function onLevelClear(silent) {
  const correct = history.filter(Boolean).length;
  const stars = correct >= 9 ? 3 : 2;
  shownStars = stars;
  if (stars > (S.stars[level] || 0)) S.stars[level] = stars;
  S.cleared[level] = true;
  if (S.unlocked < level + 2) S.unlocked = Math.min(8, level + 2);
  if (level === 6 && !S.wonOn) {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    S.wonOn = d.getFullYear() + '-' + m + '-' + day;
  }
  screen = 'clear';
  phase = 'play';
  parentPick = false;
  sfxFanfare();
  const line = level === 6
    ? 'Great job, Carlie! The sock stepped aside. You sewed the last patch onto GiGi!'
    : 'Great job, Carlie! You sewed a new patch onto GiGi!';
  setLive(line);
  persist();
  return line;
}

function masteryMet() {
  return history.length >= 10 && history.filter(Boolean).length >= 8;
}

function afterPraise() {
  if (phase !== 'praise') return;
  phase = 'play';
  praiseUntil = 0;
  praiseHold = null;
  if (level === 7) {
    if (bonusSolved >= 6) {
      screen = 'finale';
      sfxFanfare();
      setLive('Home at last, Carlie!');
      persist();
      return;
    }
    startProblem(false);
    return;
  }
  if (masteryMet()) {
    if (needsTimedPass() && pass !== 'timed') {
      history = [];
      speedCorrect = 0;
      timeRelief = 0;
      pass = 'timed';
      startProblem(false);
      setLive('Now with the timer. ' + problem.speech);
      return;
    }
    onLevelClear();
    return;
  }
  startProblem(false);
}

function onCorrect() {
  if (screen !== 'play' || phase !== 'play' || !problem) return;
  if (!problem.recorded) {
    problem.recorded = true;
    if (level !== 7) {
      if (problem.wasTimed) {
        speedCorrect++;
        if (timeRelief > 0) timeRelief--;
      }
      history.push(true);
      if (history.length > 10) history.shift();
    }
  }
  problemsDone++;
  if (level === 7) bonusSolved++;
  phase = 'praise';
  praiseWord = PRAISE[problemsDone % PRAISE.length];
  praiseUntil = performance.now() + 480;
  sfxOk();
  setLive(praiseWord + ' The answer is ' + problem.answer + '.');
  persist();
}

function onMiss(reason) {
  if (screen !== 'play' || phase !== 'play' || !problem) return;
  if (!problem.recorded && level !== 7) {
    problem.recorded = true;
    history.push(false);
    if (history.length > 10) history.shift();
  }
  problem.misses = (problem.misses || 0) + 1;
  missReason = reason;
  entry = '';
  screen = 'hint';
  frozenRemain = null;
  frozenByAway = false;
  limitMs = 0;
  if (reason === 'timeout') {
    timeRelief = Math.min(8, timeRelief + 3);
    sfxYawn();
  } else sfxBad();
  const h = hintFor(problem, problem.misses >= 2);
  setLive(h.speech);
  persist();
}

function submitEntry() {
  if (entry === '') return;
  const n = parseInt(entry, 10);
  if (n === problem.answer) onCorrect();
  else onMiss('wrong');
}

function gotoLevel(i) {
  level = i;
  frozenRemain = null;
  frozenByAway = false;
  if (i === 6) {
    history = [];
    problemsDone = 0;
    speedCorrect = 0;
    timeRelief = 0;
    pass = 'untimed';
    screen = 'boss';
    problem = null;
    setLive('A grumpy sock blocks the gate.');
    persist();
    return;
  }
  startProblem(true);
}

function openParent() {
  if (screen === 'parent' || screen === 'confirm') return;
  if (screen === 'play' && phase === 'play' && limitMs > 0 && frozenRemain == null) {
    frozenRemain = Math.max(0, limitMs - (performance.now() - startTime));
    frozenByAway = false;
  }
  parentOverride = false;
  prevScreen = screen;
  screen = 'parent';
  sfxTap();
}

function closeParent() {
  screen = prevScreen || 'title';
  parentOverride = false;
  if (away) {
    if (screen === 'play' && phase === 'play' && limitMs > 0 && frozenRemain != null) frozenByAway = true;
    else {
      frozenRemain = null;
      frozenByAway = false;
    }
    return;
  }
  if (screen === 'play' && phase === 'play' && limitMs > 0 && frozenRemain != null) {
    startTime = performance.now() - (limitMs - frozenRemain);
    frozenRemain = null;
  } else if (screen !== 'play') {
    frozenRemain = null;
  }
  frozenByAway = false;
}

function resetProgress() {
  const settings = S.settings;
  S = defaultSave();
  S.settings = settings;
  level = 0;
  history = [];
  problemsDone = 0;
  speedCorrect = 0;
  bonusSolved = 0;
  timeRelief = 0;
  pass = 'untimed';
  problem = null;
  entry = '';
  screen = 'title';
  phase = 'play';
  frozenRemain = null;
  frozenByAway = false;
  parentOverride = false;
  parentPick = false;
  S.resume = null;
  persist();
}

function activate(btn) {
  if (!btn) return;
  const now = performance.now();
  const isDigit = btn.id.indexOf('d:') === 0;
  if (!isDigit && btn.id === lastActId && now < lockUntil) return;
  if (!isDigit) {
    lastActId = btn.id;
    lockUntil = now + 220;
  }
  if (btn.id !== 'start') sfxTap();
  if (btn.id === 'start') {
    beginFromTitle();
    return;
  }
  if (btn.id === 'parent-close') { closeParent(); return; }
  if (btn.id === 'reset') { screen = 'confirm'; return; }
  if (btn.id === 'reset-no') { screen = 'parent'; return; }
  if (btn.id === 'reset-yes') { resetProgress(); return; }
  if (btn.id.indexOf('mult:') === 0) {
    S.settings.mult = parseFloat(btn.id.slice(5));
    persist();
    return;
  }
  if (btn.id === 'mute-on') { S.settings.mute = false; persist(); return; }
  if (btn.id === 'mute-off') {
    S.settings.mute = true;
    persist();
    return;
  }
  if (btn.id === 'override') {
    parentOverride = !parentOverride;
    return;
  }
  if (btn.id.indexOf('lv:') === 0) {
    const i = parseInt(btn.id.slice(3), 10);
    if (!levelOpen(i) && !parentOverride) return;
    screen = 'play';
    prevScreen = 'play';
    frozenRemain = null;
    frozenByAway = false;
    parentOverride = false;
    parentPick = !levelOpen(i);
    gotoLevel(i);
    return;
  }
  if (btn.id === 'next') {
    if (level >= 6) {
      screen = 'cert';
      setLive('Certificate for Carlie.');
      persist();
      return;
    }
    gotoLevel(level + 1);
    return;
  }
  if (btn.id === 'face') {
    startProblem(true);
    return;
  }
  if (btn.id === 'bonus') { gotoLevel(7); return; }
  if (btn.id === 'replay') { gotoLevel(0); return; }
  if (btn.id === 'tocert') {
    screen = 'cert';
    setLive('This certificate is for you, Carlie.');
    persist();
    return;
  }
  if (btn.id === 'again') {
    screen = 'play';
    phase = 'play';
    entry = '';
    limitMs = 0;
    frozenRemain = null;
    startTime = performance.now();
    setLive(problem.speech);
    return;
  }
  if (screen !== 'play' || phase !== 'play') return;
  if (btn.id.indexOf('c:') === 0) {
    lockUntil = now + 280;
    const n = parseInt(btn.id.slice(2), 10);
    if (n === problem.answer) onCorrect();
    else onMiss('wrong');
    return;
  }
  if (btn.id.indexOf('d:') === 0) {
    const d = btn.id.slice(2);
    if (entry === '0') entry = d;
    else if (entry.length < 2) entry += d;
    return;
  }
  if (btn.id === 'bk') { entry = entry.slice(0, -1); return; }
  if (btn.id === 'ok') {
    if (entry === '') return;
    lockUntil = now + 280;
    submitEntry();
  }
}

function boolHistory(list) {
  if (!Array.isArray(list)) return [];
  return list.filter((v) => v === true || v === false).slice(-10);
}

function restoreProblem(snap) {
  if (!snap || typeof snap !== 'object') return null;
  const a = snap.a | 0;
  const b = snap.b | 0;
  const kinds = ['take', 'bond', 'noregroup', 'from10', 'bridge', 'place', 'regroup'];
  if (a < 0 || a > 40 || b < 0 || b > a) return null;
  const kind = kinds.indexOf(snap.kind) >= 0 ? snap.kind : 'take';
  const p = baseProblem(a, b, kind);
  p.recorded = !!snap.recorded;
  p.wasTimed = !!snap.wasTimed;
  p.misses = Math.max(0, snap.misses | 0);
  const lines = Array.isArray(snap.lines) ? snap.lines.map(String).slice(0, 4) : null;
  const speech = typeof snap.speech === 'string' ? snap.speech : '';
  const choices = Array.isArray(snap.choices) ? snap.choices.map((n) => n | 0).slice(0, 3) : null;
  if (!lines || !lines.length || !speech || (kind === 'take' && (!choices || choices.length < 3))) decorate(p);
  else {
    p.lines = lines;
    p.speech = speech;
    if (choices) p.choices = choices;
  }
  return p;
}

function applyResumeStats(resume) {
  history = boolHistory(resume.history);
  problemsDone = Math.max(0, resume.problemsDone | 0);
  speedCorrect = Math.max(0, resume.speedCorrect | 0);
  bonusSolved = Math.max(0, resume.bonusSolved | 0);
  timeRelief = Math.max(0, Math.min(8, resume.timeRelief | 0));
  pass = resume.pass === 'timed' && needsTimedPass() ? 'timed' : 'untimed';
}

function resumePlay(resume) {
  const wanted = resume.level | 0;
  const picked = !!resume.parentPick;
  level = clampLevel(wanted, picked);
  parentPick = picked && level === wanted;
  if (level !== wanted) {
    parentPick = false;
    startProblem(true);
    return problem.speech;
  }
  applyResumeStats(resume);
  const restored = restoreProblem(resume.problem);
  if (!restored) {
    if ((resume.screen === 'play' || resume.screen === 'hint') && level !== 7) {
      history.push(false);
      if (history.length > 10) history.shift();
    }
    startProblem(false);
    return problem.speech;
  }
  problem = restored;
  entry = '';
  phase = 'play';
  lastTickSec = -1;
  frozenRemain = null;
  frozenByAway = false;
  if (resume.screen !== 'hint' && problem.recorded) {
    if (level === 7 && bonusSolved >= 6) {
      screen = 'finale';
      sfxFanfare();
      setLive('Home at last, Carlie!');
      persist();
      return 'GiGi is home.';
    }
    if (level !== 7 && masteryMet()) {
      if (needsTimedPass() && pass !== 'timed') {
        history = [];
        speedCorrect = 0;
        timeRelief = 0;
        pass = 'timed';
        startProblem(false);
        return problem.speech;
      }
      return onLevelClear(true);
    }
    startProblem(false);
    return problem.speech;
  }
  if (resume.screen === 'hint' || (problem.recorded && resume.screen === 'hint')) {
    if (!problem.recorded && level !== 7) {
      problem.recorded = true;
      history.push(false);
      if (history.length > 10) history.shift();
      problem.misses = (problem.misses || 0) + 1;
    }
    missReason = resume.missReason === 'timeout' ? 'timeout' : (resume.missReason || '');
    screen = 'hint';
    limitMs = 0;
    startTime = performance.now();
    const hint = hintFor(problem, problem.misses >= 2);
    setLive(hint.speech);
    persist();
    return hint.speech;
  }
  const savedEntry = typeof resume.entry === 'string' ? resume.entry.replace(/\D/g, '').slice(0, 2) : '';
  entry = savedEntry;
  missReason = '';
  screen = 'play';
  limitMs = computeLimit();
  problem.wasTimed = limitMs > 0;
  startTime = performance.now();
  setLive(problem.speech);
  persist();
  return problem.speech;
}

function clearResumeOk(resume) {
  const i = resume.level | 0;
  return i >= 0 && i < 8 && i < (S.unlocked | 0) && !!S.cleared[i];
}

function beginFromTitle() {
  started = true;
  unlockAudio();
  sfxStart();
  const resume = S.resume;
  if (resume && resume.screen === 'cert' && S.cleared[6]) {
    screen = 'cert';
    setLive('Hi Carlie! Your certificate is ready.');
  } else if (resume && resume.screen === 'finale') {
    screen = 'finale';
    setLive('Hi Carlie! GiGi is home.');
  } else if (resume && resume.screen === 'clear' && clearResumeOk(resume)) {
    level = resume.level | 0;
    history = boolHistory(resume.history);
    pass = resume.pass === 'timed' ? 'timed' : 'untimed';
    screen = 'clear';
    const correct = history.filter(Boolean).length;
    shownStars = S.stars[level] || (correct >= 9 ? 3 : 2);
    setLive('Hi Carlie! Level clear.');
  } else if (resume && resume.screen === 'boss' && ((S.unlocked | 0) > 6 || resume.parentPick)) {
    level = 6;
    parentPick = !!resume.parentPick;
    history = [];
    problemsDone = 0;
    speedCorrect = 0;
    timeRelief = 0;
    pass = 'untimed';
    screen = 'boss';
    setLive('Hi Carlie! A grumpy sock is blocking the gate.');
  } else if (resume && Number.isInteger(resume.level)) {
    setLive('Hi Carlie! ' + resumePlay(resume));
  } else {
    level = Math.max(0, (S.unlocked | 0) - 1);
    if (S.cleared[level] && level < 6) level = 0;
    level = clampLevel(level);
    startProblem(true);
    setLive('Hi Carlie! ' + problem.speech);
  }
}

function drawFloorNote(text, color) {
  c.font = '8px monospace';
  c.fillStyle = color || '#55ff55';
  c.fillText(text, 190, 186);
}

function drawPad(now) {
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'bk', '0', 'ok'];
  for (let i = 0; i < keys.length; i++) {
    const key = keys[i];
    const x = 164 + (i % 3) * 46;
    const y = 52 + ((i / 3) | 0) * 28;
    const id = key === 'bk' ? 'bk' : key === 'ok' ? 'ok' : 'd:' + key;
    const label = key === 'ok' ? 'OK' : (key === 'bk' ? '' : key);
    tile(x, y, 42, 24, label, key === 'ok' ? 'bold 12px' : 'bold 16px', { id: id, down: pressedId === id, pulse: true });
    if (key === 'bk') drawBackspace(x, y, pressedId === id);
  }
  drawEquation(now);
}

function drawEquation(now) {
  const bond = problem.kind === 'bond';
  const typed = phase === 'praise' ? String(problem.answer) : entry;
  const eq = bond ? (problem.a + ' = ' + problem.b + ' + ') : (problem.a + ' - ' + problem.b + ' = ');
  let size = 22;
  c.font = 'bold ' + size + 'px monospace';
  while (size > 16 && c.measureText(eq).width > 150) {
    size -= 2;
    c.font = 'bold ' + size + 'px monospace';
  }
  const tw = c.measureText(eq).width;
  const boxW = 42;
  let x = 306 - (tw + 8 + boxW);
  if (x < 122) x = 122;
  const y = 38;
  c.font = 'bold ' + size + 'px monospace';
  c.fillStyle = '#000';
  c.fillText(eq, x + 2, y + 2);
  c.fillStyle = '#ffff55';
  c.fillText(eq, x, y);
  const bx = x + tw + 6;
  R(bx, 18, boxW, 26, '#000');
  R(bx + 1, 19, boxW - 2, 24, phase === 'praise' ? '#b8e89a' : '#fff');
  c.font = 'bold ' + Math.min(size, 20) + 'px monospace';
  c.fillStyle = '#1a1030';
  c.fillText(typed, bx + 5, y);
  if (phase === 'play' && ((now / 400) | 0) % 2 === 0) {
    const cw = c.measureText(typed).width;
    R(bx + 6 + cw, 23, 2, 16, '#1a1030');
  }
}

function drawSleepyMeter(now) {
  const timed = limitMs > 0 && screen === 'play' && phase === 'play';
  if (phase === 'praise') {
    drawFloorNote(praiseWord, '#55ff55');
    return;
  }
  if (level === 0 && screen === 'play') {
    drawFloorNote('NO TIMER ON LEVEL 1', '#55ff55');
    return;
  }
  if (!timed) {
    let note = 'WARM-UP  ·  NO TIMER';
    if (level === 7) note = 'BONUS  ·  NO TIMER';
    else if (screen === 'hint' || (problem && problem.recorded && screen === 'play')) note = 'TAKE YOUR TIME';
    drawFloorNote(note, '#55ff55');
    return;
  }
  const filled = filledDots(now);
  if (filled <= 6) {
    c.font = '8px monospace';
    c.fillStyle = '#aaaaff';
    c.fillText('GIGI IS GETTING SLEEPY...', 8, 151);
  }
  for (let i = 0; i < 10; i++) {
    C(14 + i * 12, 161, 4, i < filled ? pal[i % 5] : '#2a2050');
  }
}

function renderPlay(now) {
  const boss = level === 6;
  const gx = level === 0 ? 30 : 24;
  const gy = level === 0 ? 34 : 18;
  const gh = 120;
  if (boss) {
    hideGigi();
    drawSock(12, 14);
  } else {
    const mood = (limitMs > 0 && phase === 'play' && filledDots(now) <= 4) ? 'sleepy' : 'happy';
    placeGigi(gx, gy, mood, gh);
    if (mood === 'sleepy') drawZzz(gx, gy);
  }
  if (level === 0) {
    const bubbleY = 14;
    const bubbleH = bubble(150, bubbleY, 158, problem.lines);
    const shown = phase === 'praise' ? String(problem.answer) : '?';
    const text = problem.a + ' - ' + problem.b + ' = ' + shown;
    c.font = 'bold 24px monospace';
    const em = c.measureText(text);
    const ascent = em.actualBoundingBoxAscent || 16;
    const descent = em.actualBoundingBoxDescent || 1;
    const baseline = bubbleY + bubbleH + 8 + ascent;
    c.fillStyle = '#000';
    c.fillText(text, 163, baseline + 2);
    c.fillStyle = phase === 'praise' ? '#55ff55' : '#ffff55';
    c.fillText(text, 161, baseline);
    const dotsH = 52;
    const btnH = 24;
    let dotsY = Math.ceil(baseline + descent + 5);
    let btnY = dotsY + dotsH + 4;
    if (btnY + btnH > 168) {
      const shift = btnY + btnH - 168;
      dotsY -= shift;
      btnY -= shift;
    }
    drawTakeDots(problem, 160, dotsY, false);
    problem.choices.forEach((n, i) => {
      const id = 'c:' + n;
      tile(160 + i * 46, btnY, 40, btnH, String(n), 'bold 18px', {
        id: id,
        down: pressedId === id,
        pulse: true,
        good: phase === 'praise' && n === problem.answer
      });
    });
  } else {
    drawPad(now);
  }
  drawSleepyMeter(now);
  drawPatches(null);
}

function renderHint() {
  const boss = level === 6;
  const strong = (problem.misses || 0) >= 2;
  const hint = hintFor(problem, strong);
  if (boss) {
    hideGigi();
    drawSock(8, 18);
  } else if (level === 0) {
    placeGigi(30, 34, missReason === 'timeout' ? 'sleepy' : 'happy', 120);
  } else {
    placeGigi(16, 28, missReason === 'timeout' ? 'sleepy' : 'happy', 110);
  }
  const bx = level === 0 ? 150 : 148;
  bubble(bx, 16, 162, hint.lines);
  if (level === 0) {
    drawTakeDots(problem, 160, 78, true);
    tile(160, 136, 140, 26, 'TRY AGAIN', 'bold 12px', { id: 'again', down: pressedId === 'again' });
  } else {
    drawHintVisual(156, 78, strong);
    tile(164, 136, 130, 26, 'TRY AGAIN', 'bold 12px', { id: 'again', down: pressedId === 'again' });
  }
  if (missReason === 'timeout') drawFloorNote('GIGI GOT SLEEPY', '#aaaaff');
  else drawFloorNote('LET\u2019S LOOK TOGETHER', '#55ff55');
  drawPatches(null);
}

function drawHintVisual(x, y, strong) {
  const p = problem;
  if (p.kind === 'bond') {
    drawBond(x + 16, y, p.a, p.b, strong);
    return;
  }
  if (p.kind === 'from10') {
    tenFrameSmall(x + 20, y + 8, 10, p.b);
    return;
  }
  if (p.kind === 'bridge') {
    drawBridge(x, y + 6, p, strong);
    return;
  }
  if (p.kind === 'take') {
    drawTakeDots(p, x, y, true);
    return;
  }
  if (p.kind === 'regroup') {
    const ta = (p.a / 10) | 0;
    const oa = p.a % 10;
    drawBlocks(x, y, ta - 1, oa + 10, (p.b / 10) | 0, p.b % 10);
    return;
  }
  drawBlocks(x, y, (p.a / 10) | 0, p.a % 10, (p.b / 10) | 0, p.b % 10);
}

function renderClear(now) {
  placeGigi(34, 46, 'cheer', 110);
  const sparks = [[30, 60], [130, 58], [24, 120], [136, 118]];
  for (let i = 0; i < sparks.length; i++) {
    const x = sparks[i][0];
    const y = sparks[i][1];
    R(x, y - 3, 1, 7, '#ffff55');
    R(x - 3, y, 7, 1, '#ffff55');
  }
  shadowText(level === 6 ? 'BOSS CLEAR!' : 'LEVEL CLEAR!', 78, 30, '#ffff55', 'bold 18px monospace');
  const lines = level === 6
    ? ['Great job, Carlie!', 'The sock stepped aside.', 'The last patch is on!']
    : ['Great job, Carlie!', 'You sewed a new patch', 'onto GiGi!'];
  bubble(158, 46, 152, lines);
  c.font = '8px monospace';
  c.fillStyle = '#aaaaff';
  c.fillText('STARS', 172, 110);
  const stars = shownStars;
  for (let i = 0; i < 3; i++) {
    c.font = 'bold 20px monospace';
    c.fillStyle = i < stars ? '#ffff55' : '#3a2d6a';
    c.fillText('\u2605', 200 + i * 26, 120);
  }
  const label = level === 6 ? 'CERTIFICATE \u25BA' : 'NEXT LEVEL \u25BA';

function withOverlay(fn) {
  const prev = c;
  c = oc;
  try { fn(); } finally { c = prev; }
}

function drawConfetti(now) {
  withOverlay(() => {
    oc.clearRect(0, 0, 320, 200);
    let s = 9;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    for (let i = 0; i < 70; i++) {
      const x = rnd() * 320;
      const y = 14 + rnd() * 150;
      if (((i + ((now / 140) | 0)) % 4) === 0) continue;
      R(x, y, 2, 2, pal[i % 5]);
    }
  });
}

function drawSewing() {
  withOverlay(() => {
    C(80, 128, 7, '#f48cb4');

    for (let i = 0; i < 8; i++) {
      const a = i * 0.785;
      R(80 + Math.cos(a) * 9, 128 + Math.sin(a) * 9, 1, 1, '#e05c94');
    }
    R(91, 117, 16, 3, '#3a2d6a');
    R(92, 118, 14, 1, '#eef2f6');
    R(105, 117, 2, 3, '#eef2f6');

    c.moveTo(92, 118);
    c.quadraticCurveTo(86, 112, 84, 122);

  });
}

function render(now) {
  frameNow = now;
  buttons = [];
  c = cv.getContext('2d');
  installReadableText(c);
  clearTextLayer();
  c.imageSmoothingEnabled = false;
  c.setTransform(1, 0, 0, 1, 0, 0);
  oc.setTransform(1, 0, 0, 1, 0, 0);
  oc.imageSmoothingEnabled = false;
  if (screen !== 'clear' && screen !== 'finale') oc.clearRect(0, 0, 320, 200);
  bg();
  if (screen === 'parent') {
    bar("GIGI'S WAY HOME  -  PARENT", '');
    renderParentFull();
    return;
  }
  if (screen === 'confirm') {
    bar('GIGI\'S WAY HOME  -  PARENT', '');
    renderConfirm();
    return;
  }
  const right = (screen === 'title' || screen === 'cert' || screen === 'finale') ? '' : statusRight();
  if (screen === 'title') bar("GIGI'S WAY HOME", 'FOR CARLIE');
  else if (screen === 'cert') bar("GIGI'S WAY HOME  -  CERTIFICATE", '');
  else if (screen === 'finale') bar("GIGI'S WAY HOME  -  HOME", '');
  else if (screen === 'boss') bar("GIGI'S WAY HOME  -  BOSS", statusRight());
  else bar(statusLeft(), right);

  if (screen === 'title') renderTitle();
  else if (screen === 'play') renderPlay(now);
  else if (screen === 'hint') renderHint();
  else if (screen === 'clear') renderClear(now);
  else if (screen === 'boss') renderBossIntro();
  else if (screen === 'cert') renderCert();
  else if (screen === 'finale') renderFinale(now);
}

function hitButton(x, y) {
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (x >= b.x && y >= b.y && x < b.x + b.w && y < b.y + b.h) return b;
  }
  return null;
}

function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (320 / r.width),
    y: (e.clientY - r.top) * (200 / r.height)
  };
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  resumeAudio();
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  const p = canvasPos(e);
  const btn = hitButton(p.x, p.y);
  press = { x: p.x, y: p.y, btn: btn, long: false };
  pressedId = btn ? btn.id : null;
  if (pressTimer) clearTimeout(pressTimer);
  if (p.y <= 14 && screen !== 'parent' && screen !== 'confirm') {
    pressTimer = setTimeout(() => {
      if (!press) return;
      press.long = true;
      pressedId = null;
      openParent();
    }, 2000);
  }
});

function endPress(e) {
  resumeAudio();
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (!press) return;
  const wasLong = press.long;
  const downBtn = press.btn;
  const p = e ? canvasPos(e) : { x: press.x, y: press.y };
  press = null;
  pressedId = null;
  if (wasLong) return;
  if (screen !== 'title' && screen !== 'parent' && screen !== 'confirm' && p.x <= 18 && p.y <= 14) {
    const t = performance.now();
    cornerTaps = cornerTaps.filter((n) => t - n < 1800);
    cornerTaps.push(t);
    if (cornerTaps.length >= 5) {
      cornerTaps = [];
      openParent();
      return;
    }
  }
  const upBtn = hitButton(p.x, p.y);
  if (downBtn && upBtn && downBtn.id === upBtn.id) activate(upBtn);
  else if (!downBtn && !upBtn && screen === 'title') activate({ id: 'start' });
}

cv.addEventListener('pointerup', endPress);
cv.addEventListener('pointercancel', () => {
  if (pressTimer) clearTimeout(pressTimer);
  press = null;
  pressedId = null;
});
cv.addEventListener('contextmenu', (e) => e.preventDefault());

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (screen === 'parent' || screen === 'confirm')) {
    if (screen === 'confirm') screen = 'parent';
    else closeParent();
    e.preventDefault();
    return;
  }
  if (screen === 'title' && (e.key === 'Enter' || e.key === ' ')) {
    activate({ id: 'start' });
    e.preventDefault();
    return;
  }
  if (screen !== 'play' || phase !== 'play' || !problem) return;
  if (level === 0 && problem.choices) {
    const n = parseInt(e.key, 10);
    if (problem.choices.indexOf(n) >= 0) {
      activate({ id: 'c:' + n });
      e.preventDefault();
    }
    return;
  }
  if (e.key >= '0' && e.key <= '9') { activate({ id: 'd:' + e.key }); e.preventDefault(); }
  else if (e.key === 'Backspace') { activate({ id: 'bk' }); e.preventDefault(); }
  else if (e.key === 'Enter') { activate({ id: 'ok' }); e.preventDefault(); }
});

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = document.body.clientWidth || window.innerWidth;
  const h = document.body.clientHeight || window.innerHeight;
  let pix = Math.floor(Math.min((w * dpr) / 320, (h * dpr) / 200));
  if (pix < 1) pix = 1;
  pixelSnap = pix;
  const cssW = (320 * pix) / dpr;
  const cssH = (200 * pix) / dpr;
  stage.style.width = cssW + 'px';
  stage.style.height = cssH + 'px';
  stage.style.transform = 'none';
  cv.style.width = cssW + 'px';
  cv.style.height = cssH + 'px';
  ov.style.width = cssW + 'px';
  ov.style.height = cssH + 'px';
  const bw = 320 * pix;
  const bh = 200 * pix;
  if (tx.width !== bw) tx.width = bw;
  if (tx.height !== bh) tx.height = bh;
  tx.style.width = cssW + 'px';
  tx.style.height = cssH + 'px';
  const rect = stage.getBoundingClientRect();
  const dx = Math.round(rect.left * dpr) / dpr - rect.left;
  const dy = Math.round(rect.top * dpr) / dpr - rect.top;
  if (dx || dy) stage.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
}

window.addEventListener('resize', onViewport);
window.addEventListener('orientationchange', onViewport);
document.addEventListener('visibilitychange', onViewport);
if (window.matchMedia) {
  const orientMq = window.matchMedia('(orientation: portrait)');
  if (orientMq.addEventListener) orientMq.addEventListener('change', syncAway);
  else if (orientMq.addListener) orientMq.addListener(syncAway);
}

function clockShouldPause() {
  if (document.hidden) return true;
  if (window.matchMedia && window.matchMedia('(orientation: portrait)').matches) return true;
  return window.innerHeight > window.innerWidth;
}

function pauseAway() {
  if (away) return;
  away = true;
  if (phase === 'praise' && praiseHold == null) praiseHold = Math.max(0, praiseUntil - performance.now());
  if (screen === 'play' && phase === 'play' && limitMs > 0 && frozenRemain == null) {
    frozenRemain = Math.max(0, limitMs - (performance.now() - startTime));
    frozenByAway = true;
  }
}

function resumeAway() {
  if (!away) return;
  away = false;
  if (praiseHold != null) {
    praiseUntil = performance.now() + praiseHold;
    praiseHold = null;
  }
  const parentOpen = screen === 'parent' || screen === 'confirm';
  if (!parentOpen && frozenByAway && screen === 'play' && phase === 'play' && limitMs > 0 && frozenRemain != null) {
    startTime = performance.now() - (limitMs - frozenRemain);
    frozenRemain = null;
  }
  frozenByAway = false;
  resumeAudio();
}

function syncAway() {
  if (clockShouldPause()) pauseAway();
  else resumeAway();
}

function onViewport() {
  fit();
  syncAway();
}

function loop(now) {
  syncAway();
  if (screen === 'play' && phase === 'play' && limitMs > 0 && frozenRemain == null && !away) {
    const left = limitMs - (now - startTime);
    const sec = Math.ceil(left / 1000);
    if (left <= 5000 && sec > 0 && sec !== lastTickSec) {
      lastTickSec = sec;
      tone(280 + sec * 30, 0.04, 'square', 0.018);
    }
    if (left <= 0) onMiss('timeout');
  }
  if (phase === 'praise' && praiseHold == null && !away && now >= praiseUntil) afterPraise();
  render(now);
  if (!window.__ready) window.__ready = true;
  requestAnimationFrame(loop);
}

document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());

S = loadSave();
fit();
let loopStarted = false;
function startLoop() {
  if (loopStarted) return;
  loopStarted = true;
  requestAnimationFrame(loop);
}
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('16px "GiGi Type"'),
    document.fonts.load('bold 16px "GiGi Type"')
  ]).then(startLoop, startLoop);
  setTimeout(startLoop, 500);
} else startLoop();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

function checkGenerators() {
  const errors = [];
  function run(name, fn, pred, n) {
    for (let i = 0; i < n; i++) {
      lastKey = '';
      let p = null;
      for (let t = 0; t < 40 && !p; t++) p = fn();
      if (!p) { errors.push(name + ' null'); continue; }
      if (p.answer !== p.a - p.b || p.b < 0 || p.a < p.b) errors.push(name + ' math ' + p.a + '-' + p.b);
      if (!pred(p)) errors.push(name + ' rule ' + p.kind + ' ' + p.a + '-' + p.b);
      const hint = hintFor(Object.assign({ misses: 1 }, p), true);
      hint.lines.forEach((line) => {
        if (line.length > 28) errors.push(name + ' line ' + line);
      });
    }
  }
  run('l1', genTake, (p) => p.a <= 10 && p.a >= 2 && p.kind === 'take', 80);
  run('l2', genBond, (p) => p.a <= 10 && p.a >= 5 && p.kind === 'bond', 80);
  run('l3', genWithin20, (p) => p.a <= 20 && p.a >= 11 && (p.b % 10) <= (p.a % 10), 80);
  run('l4', genThrough10, (p) => {
    if (p.kind === 'from10') return p.a === 10 && p.b >= 1 && p.b <= 9;
    return p.kind === 'bridge' && p.a >= 11 && p.a <= 18 && p.b <= 9 && p.b > (p.a % 10);
  }, 80);
  run('l5', genPlace, (p) => p.a >= 20 && p.a <= 40 && (p.b % 10) <= (p.a % 10) && p.kind === 'place', 80);
  run('l6', genRegroup, (p) => p.a >= 20 && p.a <= 40 && (p.b % 10) > (p.a % 10) && p.kind === 'regroup', 80);
  return errors.slice(0, 12);
}

if (TEST) {
  window.__test = {
    snap() {
      const rect = cv.getBoundingClientRect();
      const now = performance.now();
      return {
        screen: screen,
        phase: phase,
        level: level,
        answer: problem ? problem.answer : null,
        a: problem ? problem.a : null,
        b: problem ? problem.b : null,
        kind: problem ? problem.kind : null,
        entry: entry,
        history: history.slice(),
        problemsDone: problemsDone,
        speedCorrect: speedCorrect,
        bonusSolved: bonusSolved,
        limitMs: limitMs,
        remain: limitMs > 0 ? remainMs(now) : null,
        baseSeconds: limitSeconds(),
        pass: pass,
        timeRelief: timeRelief,
        away: away,
        audio: actx ? actx.state : null,
        parentOverride: parentOverride,
        mult: S.settings.mult,
        mute: S.settings.mute,
        cleared: S.cleared.slice(),
        stars: S.stars.slice(),
        unlocked: S.unlocked,
        misses: problem ? (problem.misses || 0) : 0,
        buttons: buttons.map((b) => ({
          id: b.id,
          label: b.label,
          x: rect.left + (b.x + b.w / 2) * rect.width / 320,
          y: rect.top + (b.y + b.h / 2) * rect.height / 200
        }))
      };
    },
    checkGenerators: checkGenerators,
    expire() {
      if (limitMs > 0 && screen === 'play') startTime = performance.now() - limitMs - 5;
    },
    suspendAudio() {
      if (!actx) unlockAudio();
      if (actx && actx.suspend) return actx.suspend();
      return null;
    },
    forceFallback() {
      const saved = lastKey;
      const p = rollGen(() => null, FALLBACKS[2]);
      const q = rollGen(() => null, FALLBACKS[2]);
      decorate(p);
      decorate(q);
      p.lines[0] = 'MUTATED';
      const ok = p !== q && p !== FALLBACKS[2] && q !== FALLBACKS[2] && !FALLBACKS[2].lines && q.lines[0] !== 'MUTATED';
      lastKey = saved;
      return ok;
    }
  };
}
